# Configuración de Mosquitto para entorno de desarrollo (Iteración 1)
# NOTA: sin autenticación ni TLS — válido solo para desarrollo local.
# En iteraciones futuras se debe restringir el acceso (usuarios/contraseña o certificados).

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log